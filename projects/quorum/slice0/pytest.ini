[pytest]
python_files = test_*.py
addopts = -q --tb=short --strict-markers
markers =
    invariant: PLAN.md I1-I12 gates (locality, synchrony, single-pass, latent reasoning, determinism, shared prefix, ...)
    slow: long-horizon runs (many seeds or full LLM path)
    llm: requires the [llm] extra (torch + vllm); auto-skipped otherwise
