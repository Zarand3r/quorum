# Source of truth for slice0's ``requirements_lock.txt``, which is what
# bazel's ``pip.parse`` reads via the ``slice0_deps`` hub in MODULE.bazel.
#
# Regenerate after edits here:
#
#   uv lock
#   uv export --extra dev --extra llm --no-hashes --no-emit-workspace \
#     --format requirements-txt > requirements_lock.txt
#
# Then: bazel test //projects/quorum/slice0/...
#
# Design context: PLAN.md §15.1 — Boids-on-grid, N=64, 32×32 toroidal grid,
# Qwen 2.5 1.5B-Instruct via vLLM, single batched forward pass per tick.
# The [llm] extra pulls torch + vllm and is only needed for the LLM policy;
# base + dev is enough for the substrate, prompts, metrics, and the
# UniformRandomPolicy baseline that grounds the Mann-Whitney U merge gate.

[project]
name = "quorum-slice0"
version = "0.1.0"
description = "Slice 0 of the quorum architecture — LLM Boids on a toroidal grid, vLLM backend."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",       # trajectory Parquet writes
    "pyarrow>=17.0.0,<20.0.0",    # parquet backend
    "scipy>=1.13.0,<2.0.0",       # Mann-Whitney U merge gate
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.100.0",        # property tests
]
# vLLM backend — huge dep set. Only pulled when running the real LLM.
llm = [
    "torch>=2.4.0,<3.0.0",
    "vllm>=0.6.0,<1.0.0",
    "transformers>=4.50.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slice0"]
