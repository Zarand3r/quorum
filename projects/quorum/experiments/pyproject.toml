# Source of truth for ``requirements_lock.txt``, which is what bazel's
# ``pip.parse`` reads via the ``experiments_deps`` hub in MODULE.bazel.
#
# Regenerate the lock after edits here:
#
#   uv lock
#   uv export --extra dev --extra viz --no-hashes --no-emit-workspace \
#     --format requirements-txt > requirements_lock.txt
#
# Then: bazel test //projects/quorum/experiments:test_suite.

[project]
name = "quorum-toy-v1"
version = "0.2.0"
description = "Toy v1 of the quorum architecture — LLM Schelling on a grid."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
]
# Web viz: FastAPI + uvicorn. Kept in an optional extra so the base package
# stays small; bazel gets both via the ``viz`` requirement + the ``dev``
# extras through the export line above.
viz = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.32.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toy_v1"]
