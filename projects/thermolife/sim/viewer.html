<!doctype html>
<meta charset="utf-8">
<title>thermolife · embedding folding</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d10; color: #d7dde3;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 12px 16px; display: flex; gap: 10px; align-items: center;
           flex-wrap: wrap; border-bottom: 1px solid #1c2127; }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  button { background: #1b2027; color: #d7dde3; border: 1px solid #2b323b;
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #232a33; }
  #stats { margin-left: auto; display: flex; gap: 16px; }
  #stats span b { color: #7fd1b9; font-weight: 600; }
  main { display: flex; justify-content: center; padding: 20px; position: relative; }
  canvas { background: #06070a; border: 1px solid #2b323b; border-radius: 4px;
           width: min(84vmin, 720px); height: min(84vmin, 720px); }
  #next.armed { border-color: #6ee78c; color: #6ee78c; animation: pulse 1.1s infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(110,231,140,.5); }
                     50% { box-shadow: 0 0 0 6px rgba(110,231,140,0); } }
  #hold { display: none; align-items: center; gap: 8px; padding: 4px 10px;
          border: 1px solid #33502f; background: #16241a; color: #9be3a0;
          border-radius: 6px; }
  #toast { position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
           padding: 6px 14px; background: #0f1a12; color: #9be3a0;
           border: 1px solid #33502f; border-radius: 6px; font-weight: 600;
           opacity: 0; pointer-events: none; }
  #toast.show { animation: flash 0.9s ease-out; }
  @keyframes flash { 0% { opacity: 0; transform: translateX(-50%) scale(0.9); }
                     15% { opacity: 1; transform: translateX(-50%) scale(1); }
                     100% { opacity: 0; } }
</style>
<header>
  <h1>thermolife · embedding folding</h1>
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="next" title="advance to a fresh scene">New scene ▸</button>
  <button id="restart">Restart</button>
  <button id="stop">Stop</button>
  <div id="hold"><span>✓ converged — <b id="hold-acc">settled</b></span></div>
  <div id="stats">
    <span>status <b id="s-status">—</b></span>
    <span>scene <b id="s-scene">0</b></span>
    <span>iter <b id="s-tick">0</b></span>
    <span>fold&nbsp;step <b id="s-fold">0</b></span>
    <span>max&nbsp;attn <b id="s-attn">0</b></span>
    <span id="acc-wrap" style="display:none">docked <b id="s-acc">0</b></span>
  </div>
</header>
<main><canvas id="c" width="720" height="720"></canvas><div id="toast"></div></main>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

async function post(path) { try { await fetch(path, { method: "POST" }); } catch (e) {} }
for (const id of ["start", "pause", "resume", "next", "restart", "stop"])
  document.getElementById(id).onclick = () => post("/" + id);

let lastScene = null;
function flashToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("show"); void t.offsetWidth; t.classList.add("show");
}

// distinct hue per token
const hue = i => `hsl(${(i * 47) % 360} 70% 60%)`;

// map world coords (blob outlines share the token position plane) → canvas,
// autoscaling to the bounding box of every contour point so the fold stays framed.
function fitTransform(tokens, W, H, pad) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const t of tokens) for (const [x, y] of t.contour) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (!isFinite(minX)) return null;
  const sx = (W - 2 * pad) / Math.max(1e-6, maxX - minX);
  const sy = (H - 2 * pad) / Math.max(1e-6, maxY - minY);
  const s = Math.min(sx, sy);
  const ox = pad + (W - 2 * pad - s * (maxX - minX)) / 2 - s * minX;
  const oy = pad + (H - 2 * pad - s * (maxY - minY)) / 2 - s * minY;
  return ([x, y]) => [ox + s * x, oy + s * y];
}

function draw(state) {
  document.getElementById("s-status").textContent = state.status;
  document.getElementById("s-scene").textContent = state.fold ?? 0;
  document.getElementById("s-tick").textContent = state.tick;
  document.getElementById("s-fold").textContent = (state.fold_step ?? 0).toFixed(4);
  document.getElementById("s-attn").textContent = (state.max_attn ?? 0).toFixed(2);
  const accWrap = document.getElementById("acc-wrap");
  if (state.accuracy != null) {
    accWrap.style.display = "";
    document.getElementById("s-acc").textContent = Math.round(state.accuracy * 100) + "%";
  } else accWrap.style.display = "none";

  // scene change → flash a toast so the reset is never silent/discontinuous
  if (lastScene !== null && state.fold !== lastScene) flashToast("scene " + state.fold + " ▸");
  lastScene = state.fold;
  // held (settled): show a banner + arm the New-scene button (reset is gated)
  const held = !!state.held;
  document.getElementById("hold").style.display = held ? "flex" : "none";
  document.getElementById("next").classList.toggle("armed", held);
  if (held) document.getElementById("hold-acc").textContent =
    state.accuracy != null ? Math.round(state.accuracy * 100) + "% docked" : "settled";

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const tokens = state.tokens || [];
  const T = fitTransform(tokens, canvas.width, canvas.height, 48);
  if (!T) return;

  // docking bonds first (behind the blobs).
  // trained mode: green = bond to the true partner, red = a wrong bond.
  const partner = state.partner;
  for (const [i, j, w] of state.edges || []) {
    const [ax, ay] = T(tokens[i].pos), [bx, by] = T(tokens[j].pos);
    let rgb = "127,209,185";
    if (partner) rgb = (partner[i] === j) ? "110,231,140" : "235,110,110";
    ctx.strokeStyle = `rgba(${rgb},${Math.min(0.9, w)})`;
    ctx.lineWidth = 0.5 + 3 * w;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // morphing contour blobs
  tokens.forEach((t, i) => {
    ctx.beginPath();
    t.contour.forEach((p, k) => {
      const [x, y] = T(p);
      k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = hue(i).replace("60%)", "60% / 0.30)").replace("hsl", "hsla");
    ctx.fill();
    ctx.strokeStyle = hue(i); ctx.lineWidth = 2; ctx.stroke();
    const [cx, cy] = T(t.pos);
    ctx.fillStyle = hue(i);
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 2 * Math.PI); ctx.fill();
  });
}

async function poll() {
  try { const r = await fetch("/state"); if (r.ok) draw(await r.json()); } catch (e) {}
}
setInterval(poll, 150);
poll();
</script>
