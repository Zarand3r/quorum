<!doctype html>
<meta charset="utf-8">
<title>thermolife · economy</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0d10; color: #d7dde3;
         font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 12px 16px; display: flex; gap: 10px; align-items: center;
           flex-wrap: wrap; border-bottom: 1px solid #1c2127; }
  h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  button { background: #1b2027; color: #d7dde3; border: 1px solid #2b323b;
           border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: #232a33; }
  #stats { margin-left: auto; display: flex; gap: 16px; flex-wrap: wrap; }
  #stats span b { color: #7fd1b9; font-weight: 600; }
  #resid.bad b { color: #eb6e6e; }
  #extinct { display: none; padding: 4px 10px; border: 1px solid #5a2f2f;
             background: #241616; color: #e39b9b; border-radius: 6px; }
  main { display: flex; justify-content: center; padding: 20px; }
  canvas { background: #06070a; border: 1px solid #2b323b; border-radius: 4px;
           width: min(84vmin, 720px); height: min(84vmin, 720px); }
  #legend { text-align: center; color: #6a6a72; font-size: 12px; padding-bottom: 16px; }
</style>
<header>
  <h1>thermolife · economy</h1>
  <button id="start">Start</button>
  <button id="pause">Pause</button>
  <button id="resume">Resume</button>
  <button id="restart">Restart</button>
  <button id="stop">Stop</button>
  <div id="extinct">✗ extinct — Restart</div>
  <div id="stats">
    <span>status <b id="s-status">—</b></span>
    <span>tick <b id="s-tick">0</b></span>
    <span>pop <b id="s-n">0</b></span>
    <span>energy <b id="s-energy">0</b></span>
    <span id="resid">residual <b id="s-resid">0</b></span>
  </div>
</header>
<main><canvas id="c" width="720" height="720"></canvas></main>
<div id="legend">
  orange = drifting resource source (dashed = orbit trail + harvest range) ·
  blue = tokens, radius ∝ energy · cyan lines = energy transfer along attention edges
</div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
async function post(path) { try { await fetch(path, { method: "POST" }); } catch (e) {} }
for (const id of ["start", "pause", "resume", "restart", "stop"])
  document.getElementById(id).onclick = () => post("/" + id);

// keep a short trail of recent source positions to show the drift/orbit
let trail = [];

// fit world coords (token positions + source + trail) → canvas, autoscaled.
function fitTransform(pts, W, H, pad) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of pts) {
    if (x < minX) minX = x; if (x > maxX) maxX = x;
    if (y < minY) minY = y; if (y > maxY) maxY = y;
  }
  if (!isFinite(minX)) return null;
  const s = Math.min((W - 2*pad) / Math.max(1e-6, maxX-minX),
                     (H - 2*pad) / Math.max(1e-6, maxY-minY));
  const ox = pad + (W - 2*pad - s*(maxX-minX))/2 - s*minX;
  const oy = pad + (H - 2*pad - s*(maxY-minY))/2 - s*minY;
  return ([x, y]) => [ox + s*x, oy + s*y];   // note: canvas y grows down; fine for a plane
}

function draw(state) {
  document.getElementById("s-status").textContent = state.status;
  document.getElementById("s-tick").textContent = state.tick;
  document.getElementById("s-n").textContent = state.n + " / " + (state.n_max ?? "?");
  document.getElementById("s-energy").textContent = (state.energy ?? 0).toFixed(1);
  const resid = Math.abs(state.residual ?? 0);
  document.getElementById("s-resid").textContent = resid.toExponential(1);
  document.getElementById("resid").classList.toggle("bad", resid > 1e-9);
  document.getElementById("extinct").style.display =
    (state.status === "RUNNING" && state.n === 0) ? "" : "none";

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const toks = state.tokens || [];
  const src = state.source;
  if (!src) return;
  // maintain the source trail (reset if we jumped, e.g. restart)
  const last = trail[trail.length - 1];
  if (!last || Math.hypot(last[0]-src[0], last[1]-src[1]) > 1.5) trail = [];
  trail.push(src); if (trail.length > 80) trail.shift();

  const pts = toks.map(t => t.pos).concat([src], trail);
  const T = fitTransform(pts, canvas.width, canvas.height, 56);
  if (!T) return;
  const emax = Math.max(1e-6, state.e_max ?? 1);

  // harvest range around the source
  const [sx, sy] = T(src);
  const [ex] = T([src[0] + (state.harvest_radius ?? 0.6), src[1]]);
  const hr = Math.abs(ex - sx);
  ctx.beginPath(); ctx.arc(sx, sy, 2*hr, 0, 2*Math.PI);
  ctx.fillStyle = "rgba(230,161,90,0.06)";
  ctx.strokeStyle = "rgba(230,161,90,0.25)"; ctx.setLineDash([4,4]); ctx.lineWidth = 1;
  ctx.fill(); ctx.stroke(); ctx.setLineDash([]);

  // source orbit trail
  if (trail.length > 1) {
    ctx.beginPath();
    trail.forEach((p, k) => { const [x,y] = T(p); k ? ctx.lineTo(x,y) : ctx.moveTo(x,y); });
    ctx.strokeStyle = "rgba(230,161,90,0.35)"; ctx.setLineDash([2,3]); ctx.lineWidth = 1.5;
    ctx.stroke(); ctx.setLineDash([]);
  }

  // energy-transfer edges (attention operator only)
  for (const [i, j, w] of state.edges || []) {
    if (!toks[i] || !toks[j]) continue;
    const [ax, ay] = T(toks[i].pos), [bx, by] = T(toks[j].pos);
    ctx.strokeStyle = `rgba(127,209,209,${Math.min(0.8, 0.2 + 3*w)})`;
    ctx.lineWidth = 0.5 + 4*w;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // tokens: radius + opacity ∝ energy
  for (const t of toks) {
    const [x, y] = T(t.pos);
    const f = Math.min(1, Math.max(0, t.e) / emax);
    ctx.beginPath(); ctx.arc(x, y, 2 + 5*Math.sqrt(f), 0, 2*Math.PI);
    ctx.fillStyle = `rgba(90,169,230,${0.35 + 0.5*f})`; ctx.fill();
  }

  // source marker on top
  ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 2*Math.PI);
  ctx.fillStyle = "#ffb347"; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  ctx.fill(); ctx.stroke();
}

async function poll() {
  try { const r = await fetch("/state"); if (r.ok) draw(await r.json()); } catch (e) {}
}
setInterval(poll, 120);
poll();
</script>
