# World / physics configuration.
#
# Slice 0 (PLAN.md §15.1) uses the `static_gradient` scenario: the forager
# must survive on it and DIE when it is removed. The `first_experiment`
# scenario (PLAN.md §12) is the first real learning run — moving source,
# diffusing waste, heat cost, periodic shocks.
#
# All conserved-quantity accounting (I1) references these constants; changing
# a diffusion/decay constant changes what the conservation ledger expects.

grid:
  height: 64
  width: 64
  batch: 8            # fills one GPU at M2+; Slice 0 is batch-agnostic

# Physical channels (PLAN.md §9.1). Diffusion D and decay δ per field.
fields:
  nutrient:                 # n:  n' = n + D∇²n + s − uptake
    diffusion: 0.10
    decay: 0.0              # nutrient is conserved except through source s and uptake
    ambient: 0.0
  waste:                    # w:  w' = w + D∇²w + α·uptake − δ_w·w
    diffusion: 0.15
    decay: 0.01             # δ_w — waste removal sink (accounted in ledger)
    alpha: 0.30             # α — waste produced per unit uptake
  heat:                     # τ:  τ' = τ + D∇²τ + β·cost − δ_τ(τ − ambient)
    diffusion: 0.20
    decay: 0.05             # δ_τ — cooling toward ambient
    ambient: 0.20
    beta: 0.50              # β — heat produced per unit energy spent
  pheromone:                # external/agent signal field
    diffusion: 0.25
    decay: 0.10
    ambient: 0.0

# Energy accounting (PLAN.md §10.3). e' = e + η·uptake − Σ costs.
energy:
  eta: 0.80                 # η — nutrient→energy conversion efficiency (< 1: lossy, I3)
  cost_move: 0.05
  cost_signal: 0.02
  cost_plasticity: 0.03     # M4+; charged per plastic update
  cost_repair: 0.04
  e_lethal: 0.02            # below this → dying (I4)
  e_div: 1.50               # above this → division permitted (M6)

# Viability soft-barriers B(·) (PLAN.md §10.4). Rise sharply near lethal.
# Exact shape is Open Question §24.1 — decided empirically at M2.
barriers:
  tau_lethal: 1.00
  w_lethal: 1.00
  barrier_sharpness: 8.0

lifecycle:
  alive_threshold: 0.50     # alive-prob below → inert (I4)
  decomp_return_fraction: 0.90   # biomass fraction returned to nutrient on death (≤1, I1)
  population_cap_fraction: 0.60  # max occupied cells (I15)

# Scenarios ----------------------------------------------------------------
scenarios:
  static_gradient:          # Slice 0 gate (§15.1)
    source: {kind: static, cx: 16, cy: 16, rate: 0.50, radius: 8}
    shocks: none
    removal_tick: 5000      # gradient removed here; forager must then die

  first_experiment:         # PLAN.md §12
    source: {kind: moving, rate: 0.50, radius: 6, speed: 0.20, path: random_walk}
    shocks: {kind: periodic, interval: 800, jitter: 200, type: [heat_wave, toxic_pulse]}

# Determinism (I8).
seed: 42
deterministic: true
