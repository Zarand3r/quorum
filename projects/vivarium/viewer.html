<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vivarium — dock-and-morph dish</title>
<style>
  body { margin: 0; background: #0b0e13; color: #cbd5e1; font: 13px ui-monospace, monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; }
  #hud { display: flex; gap: 18px; align-items: center; margin-bottom: 8px; }
  #hud b { color: #e2e8f0; }
  #alive { color: #34d399; }
  canvas { background: #0e131b; border: 1px solid #1e293b; border-radius: 6px; }
  button { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; border-radius: 4px;
           padding: 4px 10px; cursor: pointer; font: inherit; }
  button:hover { background: #334155; }
  .note { color: #64748b; margin-top: 6px; max-width: 720px; text-align: center; }
  #knobs { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  #knobs label { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #94a3b8; }
  #knobs input[type=range] { width: 130px; accent-color: #34d399; }
  #knobs b { color: #e2e8f0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>tick <b id="tick">0</b></span>
    <span>agents <b id="n">0</b></span>
    <span>aliveness <b id="alive">–</b></span>
    <button onclick="post('/pause')">pause</button>
    <button onclick="post('/resume')">resume</button>
    <button onclick="post('/restart')">restart (new seed)</button>
  </div>
  <canvas id="c" width="720" height="720"></canvas>
  <div id="knobs">
    <label>noise <input type="range" id="k_noise" min="0" max="1.5" step="0.02"><span>σ <b id="v_noise">–</b></span></label>
    <label>skew-rotation <input type="range" id="k_spin" min="0" max="1" step="0.02"><b id="v_spin">–</b></label>
    <label>non-reciprocal (circulation) <input type="range" id="k_nonrecip" min="0" max="3" step="0.05"><b id="v_nonrecip">–</b></label>
    <label>reaction-diffusion <input type="range" id="k_rd" min="0" max="2" step="0.05"><b id="v_rd">–</b></label>
    <label>speed <input type="range" id="k_scale" min="0.05" max="1" step="0.02"><b id="v_scale">–</b></label>
  </div>
  <div class="note">Motion comes from neighbour forces (attract / repel / non-reciprocal chase);
  shapes morph via the transformer block. Interaction is load-bearing by construction — with no
  neighbours an agent cannot move. Aliveness is <i>measured, never optimized</i>.</div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

// works whether served at / or under a path prefix (e.g. /vivarium via tailscale funnel).
const BASE = location.pathname.replace(/\/(index\.html)?$/, '');

function post(path){ fetch(BASE + path, {method:'POST'}); }

// live knobs
const KNOBS = ['noise','spin','nonrecip','scale','rd'];
let knobsInit = false, setTimer = null;
function initKnobs(k){
  if(knobsInit || !k) return;
  for(const name of KNOBS){
    if(k[name] === undefined) continue;
    const el = document.getElementById('k_'+name);
    if(el){ el.value = k[name]; document.getElementById('v_'+name).textContent = (+k[name]).toFixed(2); }
  }
  knobsInit = true;
}
function pushKnobs(){
  const q = KNOBS.map(n => {
    const el = document.getElementById('k_'+n);
    document.getElementById('v_'+n).textContent = (+el.value).toFixed(2);
    return n+'='+el.value;
  }).join('&');
  fetch(BASE + '/set?' + q, {method:'POST'});
}
for(const name of KNOBS){
  const el = document.getElementById('k_'+name);
  el.addEventListener('input', () => {
    document.getElementById('v_'+name).textContent = (+el.value).toFixed(2);
    clearTimeout(setTimer); setTimer = setTimeout(pushKnobs, 80);
  });
}

// double-buffer snapshots and interpolate between them, so motion is smooth even when
// frames arrive irregularly over the network.
let PREV = null, CUR = null, CUR_T = 0;
const POLL_MS = 120, INTERP_MS = 130;
const lerp = (a,b,t)=> a + (b-a)*t;

function draw(al){
  const s = CUR; if(!s) return;
  document.getElementById('tick').textContent = s.tick;
  document.getElementById('n').textContent = s.n;
  const ae = document.getElementById('alive');
  ae.textContent = (s.aliveness ?? 0).toFixed(3);
  ae.style.color = s.aliveness > 0.02 ? '#34d399' : '#f59e0b';
  initKnobs(s.knobs);

  const N = s.tokens.length;
  const canInterp = PREV && PREV.tokens.length === N;
  const B = s.pos_bound || 6.0;
  const sc = (W*0.46)/B, cx = W/2, cy = H/2;
  const X = p => cx + p*sc, Y = p => cy - p*sc;

  // interpolated screen positions
  const px = new Array(N), py = new Array(N);
  for(let i=0;i<N;i++){
    const c = s.tokens[i];
    const x = canInterp ? lerp(PREV.tokens[i].x, c.x, al) : c.x;
    const y = canInterp ? lerp(PREV.tokens[i].y, c.y, al) : c.y;
    px[i] = X(x); py[i] = Y(y);
  }

  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(56,189,248,0.10)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(const [i,j] of s.edges){ ctx.moveTo(px[i],py[i]); ctx.lineTo(px[j],py[j]); }
  ctx.stroke();

  for(let idx=0; idx<N; idx++){
    const c = s.tokens[idx].c, K = c.length/2;
    const hue = (idx*47)%360;
    ctx.beginPath();
    const STEP = 24;
    for(let m=0; m<=STEP; m++){
      const th = 2*Math.PI*m/STEP;
      let r = 9;
      for(let k=1;k<=K;k++){ r += 5*(c[2*(k-1)]*Math.cos(k*th) + c[2*(k-1)+1]*Math.sin(k*th)); }
      r = Math.max(3, Math.min(26, r));
      const x = px[idx] + r*Math.cos(th), y = py[idx] + r*Math.sin(th);
      if(m===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue},70%,60%,0.35)`;
    ctx.strokeStyle = `hsla(${hue},70%,70%,0.9)`;
    ctx.lineWidth = 1.3; ctx.fill(); ctx.stroke();
  }
}

async function poll(){
  try {
    const r = await fetch(BASE + '/state');
    const d = await r.json();
    PREV = CUR; CUR = d; CUR_T = performance.now();
  } catch(e){}
  setTimeout(poll, POLL_MS);
}
function render(){
  const al = CUR ? Math.min(1, (performance.now() - CUR_T)/INTERP_MS) : 0;
  draw(al);
  requestAnimationFrame(render);
}
poll(); render();
</script>
</body>
</html>
